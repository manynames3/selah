name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install development tooling
        run: npm ci

      - name: Validate source and security policy
        run: npm run check

      - name: Test playback, sessions and media lifecycle
        run: npm test

      - name: Build public assets
        run: npm run build

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Test publishing, sharing and moderation journeys
        run: npm run test:e2e

      - name: Validate patch hygiene
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD --
